<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sigma Brain · esempio di integrazione</title>
<style>
  /* Pagina ospite minima: incorpora Sigma Brain in un iframe e lo pilota con postMessage */
  :root { --ink: #121214; --ink-2: #55575c; --line: rgba(18,18,20,.12); --well: rgba(18,18,20,.06); --accent: #8b5cf6; }
  body { margin: 0; font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: #fafaf8; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px; display: grid; gap: 18px; }
  h1 { font-size: 18px; margin: 0; letter-spacing: .02em; }
  h2 { font-size: 12px; margin: 0 0 8px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); }
  p { margin: 0; color: var(--ink-2); max-width: 70ch; }
  .frame { aspect-ratio: 16 / 9; width: 100%; border: 0; border-radius: 14px; background: #d7d7d5; display: block; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  button { font: inherit; color: inherit; cursor: pointer; border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 6px 14px; }
  button:hover { background: var(--well); }
  button[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .log { font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background: var(--well); border-radius: 10px; padding: 10px 12px; max-height: 180px; overflow: auto; white-space: pre-wrap; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
</style>
</head>
<body>
<main>
  <h1>Sigma Brain · esempio di integrazione</h1>
  <p>Questa pagina incorpora <code>index.html</code> in un iframe senza interfaccia (<code>?ui=off</code>) e lo pilota con <code>postMessage</code>. Il codice è in fondo al file: copialo nella tua app.</p>

  <!-- allow="microphone" serve perché l'iframe possa chiedere il permesso del microfono -->
  <iframe id="brain" class="frame" src="../index.html?ui=off#idle" allow="microphone" title="Sigma Brain"></iframe>

  <section>
    <h2>Stati dell'assistente</h2>
    <div class="row" id="states"></div>
  </section>

  <section>
    <h2>Conversazione simulata</h2>
    <div class="row">
      <button type="button" class="primary" id="simulate">Simula una conversazione</button>
      <button type="button" id="ui-toggle" aria-pressed="false">Mostra i comandi del fluido</button>
      <button type="button" id="export">Leggi la configurazione</button>
      <button type="button" id="mic">Attiva il microfono</button>
    </div>
  </section>

  <section>
    <h2>Forme e colori diretti</h2>
    <div class="row">
      <button type="button" data-shape="🚀">🚀</button>
      <button type="button" data-shape="⚡">⚡</button>
      <button type="button" data-shape="★">★</button>
      <button type="button" data-shape="M12 2L2 22h20Z">path (triangolo)</button>
      <button type="button" data-spell="CIAO">scrivi CIAO</button>
      <button type="button" data-color="#ff0066">colore #ff0066</button>
      <button type="button" data-color-mode="audio">colore da audio</button>
      <button type="button" data-color-mode="capability">colore per stato</button>
    </div>
  </section>

  <section>
    <h2>Messaggi inviati e ricevuti</h2>
    <div class="log" id="log"></div>
  </section>
</main>

<script>
  // ---- 1. riferimenti e invio dei messaggi ----
  const frame = document.getElementById('brain');
  const ready = new Promise((ok) => frame.addEventListener('load', ok, { once: true }));
  const log = document.getElementById('log');
  const write = (dir, msg) => { log.textContent = `${dir} ${JSON.stringify(msg)}\n` + log.textContent; };
  async function send(msg) {
    await ready;                                   // i messaggi prima del load andrebbero persi
    frame.contentWindow.postMessage(msg, '*');     // in produzione: l'origine della pagina del fluido
    write('→', msg);
  }

  // ---- 2. eventi dell'app → stati del fluido ----
  // Nella tua app basta chiamare brain('web') quando l'assistente inizia a cercare, brain('reply') quando risponde, ecc.
  const MAP = { idle: 'idle', thinking: 'thinking', reply: 'answering', web: 'searching', files: 'reading',
                vision: 'looking', code: 'coding', hello: 'greeting', error: 'error', done: 'done' };
  function brain(event) { return send({ type: 'sigmabrain:state', name: MAP[event] || 'idle' }); }

  // ---- 3. pulsanti di prova ----
  const STATES = ['idle', 'thinking', 'answering', 'searching', 'reading', 'looking', 'coding', 'greeting', 'error', 'done'];
  const box = document.getElementById('states');
  for (const s of STATES) {
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = s; b.dataset.state = s; b.setAttribute('aria-pressed', s === 'idle');
    b.onclick = () => { send({ type: 'sigmabrain:state', name: s }); mark(s); };
    box.appendChild(b);
  }
  function mark(s) { for (const b of box.children) b.setAttribute('aria-pressed', b.dataset.state === s); }

  document.getElementById('simulate').onclick = async () => {
    const steps = [['hello', 2500], ['thinking', 3000], ['web', 5000], ['files', 5000], ['code', 5000], ['reply', 4000], ['done', 3000], ['idle', 0]];
    for (const [event, ms] of steps) { await brain(event); mark(MAP[event]); await new Promise((r) => setTimeout(r, ms)); }
  };

  let uiVisible = false;
  document.getElementById('ui-toggle').onclick = (e) => {
    uiVisible = !uiVisible;
    e.currentTarget.setAttribute('aria-pressed', uiVisible);
    e.currentTarget.textContent = uiVisible ? 'Nascondi i comandi del fluido' : 'Mostra i comandi del fluido';
    send({ type: 'sigmabrain:ui', visible: uiVisible });
  };
  document.getElementById('export').onclick = () => send({ type: 'sigmabrain:export' });
  // il microfono va chiesto dall'interno dell'iframe: mostriamo i comandi e invitiamo a premere "Microfono"
  document.getElementById('mic').onclick = () => { send({ type: 'sigmabrain:ui', visible: true }); alert('Premi "Microfono" nel pannello in basso del fluido (il permesso lo chiede il browser).'); };

  for (const b of document.querySelectorAll('[data-shape]')) b.onclick = () => send({ type: 'sigmabrain:shape', source: b.dataset.shape });
  for (const b of document.querySelectorAll('[data-spell]')) b.onclick = () => send({ type: 'sigmabrain:spell', word: b.dataset.spell });
  for (const b of document.querySelectorAll('[data-color]')) b.onclick = () => send({ type: 'sigmabrain:color', color: b.dataset.color });
  for (const b of document.querySelectorAll('[data-color-mode]')) b.onclick = () => send({ type: 'sigmabrain:colorMode', mode: b.dataset.colorMode });

  // ---- 4. risposte dal fluido (per ora solo l'export della configurazione) ----
  window.addEventListener('message', (e) => {
    if (e.source !== frame.contentWindow) return;
    const d = e.data;
    if (d && d.type === 'sigmabrain:config') write('←', { type: d.type, state: d.config.state, states: Object.keys(d.config.states) });
  });
</script>
</body>
</html>
